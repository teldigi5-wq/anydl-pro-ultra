name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: anydl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TypeScript and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test privileged IPC trust boundary
        run: npm run security:test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Generate verifiable remediation lockfile for review
        shell: bash
        run: |
          set -euo pipefail
          cd .
          npm install electron-builder@26.18.0 vite@7.3.7 --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs=require('node:fs');
          const b64=fs.readFileSync('package-lock.json').toString('base64');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          console.log('REMEDIATION_VERSIONS='+JSON.stringify(Object.fromEntries(['body-parser','axios','follow-redirects','sharp','proxy-addr','qs','electron','electron-builder','vite','tar'].map(n=>[n,lock.packages['node_modules/'+n]?.version||null]))));
          for(let i=0;i<b64.length;i+=8000) console.log('REMEDIATION_LOCK_CHUNK_'+String(i/8000).padStart(4,'0')+'='+b64.slice(i,i+8000));
          console.log('REMEDIATION_LOCK_END='+Math.ceil(b64.length/8000));
          NODE

      - name: Audit dependencies (high severity)
        run: npm audit --audit-level=high

  package-windows:
    name: Package Windows installer
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch yt-dlp and FFmpeg binaries
        run: npm run fetch-bin

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        run: npm run electron:pack

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyDL-Pro-Ultra-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
