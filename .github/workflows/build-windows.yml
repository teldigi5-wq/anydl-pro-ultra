name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: anydl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TypeScript and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test privileged IPC trust boundary
        run: npm run security:test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Audit dependencies (high severity)
        run: npm audit --audit-level=high

  package-windows:
    name: Package Windows installer
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify sandboxed Electron renderer on Windows
        run: npx electron electron/renderer-sandbox-smoke.cjs

      - name: Fetch yt-dlp and FFmpeg binaries
        run: npm run fetch-bin

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        run: npm run electron:pack

      - name: Create SHA-256 installer evidence
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No Windows installer found' }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Write-Host "Installer SHA-256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AnyDL-Pro-Ultra-Windows-Installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
