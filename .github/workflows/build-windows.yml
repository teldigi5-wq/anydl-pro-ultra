name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: anydl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TypeScript and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  package-windows:
    name: Package Windows installer
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch yt-dlp and FFmpeg binaries
        run: npm run fetch-bin

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        run: npm run electron:pack

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyDL-Pro-Ultra-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
